# The repo's check flow — the deterministic place the whole-repo Claudinite
# world sweep runs at each change. The site itself is static and has nothing to
# build or test; `npm test` runs the fixtures behind this repo's own local-pack
# checks, as a step ahead of the sweep rather than a separate workflow, so one
# red flow means one thing.
#
# The WORK scope is deliberately absent here: it judges a session's own change
# with that session's transcript and runs at the Stop hook, not in CI.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Claudinite world sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The repo's own suite: the fixtures behind this repo's local-pack checks
      # (node --test, no dependencies). Ahead of the sweep, so one red flow still
      # means one thing.
      - name: Tests
        run: npm test

      # The engine's always-vendored Node CLI, invoked as the standalone
      # command — never as a language-specific test file a runner discovers.
      - name: Claudinite world scope
        run: node .claudinite/shared/engine/checks/check_the_world.mjs
